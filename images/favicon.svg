<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D81B60"/>
      <stop offset="50%" stop-color="#5B2A86"/>
      <stop offset="100%" stop-color="#FF6F61"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="#FFE082" stroke-width="2.5"/>
  <!-- Decorative Stitched Border -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- Needle & Golden Thread -->
  <path d="M 28 72 Q 40 45, 52 50 T 70 30" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  <!-- Scissors Motif -->
  <g transform="translate(50, 48) rotate(-25) translate(-25, -25)">
    <!-- Scissor Loop 1 -->
    <circle cx="16" cy="38" r="7" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Scissor Loop 2 -->
    <circle cx="34" cy="38" r="7" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Blades -->
    <path d="M 18 32 L 35 10" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 32 32 L 15 10" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Pivot Pin -->
    <circle cx="25" cy="23" r="2.5" fill="#FFB300"/>
  </g>
</svg>
