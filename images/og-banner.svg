<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A1152"/>
      <stop offset="45%" stop-color="#5B2A86"/>
      <stop offset="85%" stop-color="#D81B60"/>
      <stop offset="100%" stop-color="#FF6F61"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </linearGradient>
    <pattern id="bandhani" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2.5" fill="#FFFFFF" fill-opacity="0.12"/>
      <circle cx="10" cy="10" r="1.5" fill="#FFB300" fill-opacity="0.15"/>
      <circle cx="30" cy="30" r="1.5" fill="#FFB300" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>
  <rect width="1200" height="630" fill="url(#bandhani)"/>

  <!-- Ornate Border -->
  <rect x="25" y="25" width="1150" height="580" rx="16" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <rect x="35" y="35" width="1130" height="560" rx="12" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="8,6"/>

  <!-- Floating Circles Accent -->
  <circle cx="1050" cy="150" r="180" fill="#FFB300" fill-opacity="0.12" filter="blur(40px)"/>
  <circle cx="950" cy="450" r="160" fill="#00897B" fill-opacity="0.15" filter="blur(35px)"/>

  <!-- Left Content Area -->
  <g transform="translate(80, 110)">
    <!-- Badge -->
    <rect x="0" y="0" width="410" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.15" stroke="url(#gold)" stroke-width="1.5"/>
    <text x="20" y="27" fill="#FFE082" font-family="'Poppins', sans-serif" font-weight="600" font-size="16" letter-spacing="1.5">
      ★ BESPOKE INDIAN ATELIER • 25+ YEARS
    </text>

    <!-- Brand Name -->
    <text x="0" y="115" fill="#FFFFFF" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="64">
      Ambica Ladies Tailor
    </text>
    <text x="0" y="170" fill="#FFD54F" font-family="'Poppins', sans-serif" font-weight="500" font-size="34">
      અંબિકા લેડીઝ ટેલર
    </text>

    <!-- Tagline -->
    <text x="0" y="240" fill="#FFF6FB" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-size="32">
      "Colours stitched to fit you."
    </text>

    <!-- Offerings List -->
    <text x="0" y="295" fill="#FFFFFF" fill-opacity="0.9" font-family="'Poppins', sans-serif" font-size="22" font-weight="400">
      Blouses • Anarkalis • Festive Dresses • Kurtis • Bridal Gowns
    </text>
    <text x="0" y="330" fill="#FFE082" font-family="'Poppins', sans-serif" font-size="20" font-weight="400">
      One experienced master tailor • Custom body fitting • No two pieces same
    </text>

    <!-- CTA & Phone Badge -->
    <g transform="translate(0, 375)">
      <rect x="0" y="0" width="380" height="64" rx="32" fill="#00897B" stroke="#80CBC4" stroke-width="2"/>
      <circle cx="36" cy="32" r="18" fill="#25D366"/>
      <path d="M 31 25 L 41 25 Q 43 25, 43 27 L 43 37 Q 43 39, 41 39 L 31 39 Q 29 39, 29 37 L 29 27 Q 29 25, 31 25 Z" fill="#FFFFFF" fill-opacity="0.3"/>
      <text x="70" y="39" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-weight="700" font-size="22">
        WhatsApp: +91 98209 21522
      </text>
    </g>
  </g>

  <!-- Right Visual / Silhouette Motif -->
  <g transform="translate(860, 290)">
    <!-- Decorative Circle -->
    <circle cx="100" cy="20" r="150" fill="#FFFFFF" fill-opacity="0.08" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="100" cy="20" r="130" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="6,6"/>
    <!-- Stylized Tailoring Icon Artwork -->
    <!-- Scissor -->
    <g transform="translate(70, -20) rotate(15) scale(1.6)">
      <circle cx="16" cy="38" r="7" fill="none" stroke="#FFE082" stroke-width="2.5"/>
      <circle cx="34" cy="38" r="7" fill="none" stroke="#FFE082" stroke-width="2.5"/>
      <path d="M 18 32 L 35 10" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <path d="M 32 32 L 15 10" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <circle cx="25" cy="23" r="2.5" fill="#FFB300"/>
    </g>
    <!-- Thread Line -->
    <path d="M 10 90 Q 60 40, 110 90 T 200 60" fill="none" stroke="url(#gold)" stroke-width="3" stroke-dasharray="4,4"/>
    <text x="100" y="130" text-anchor="middle" fill="#FFE082" font-family="'Poppins', sans-serif" font-size="16" font-weight="500">
      Master Fit • Pure Craft
    </text>
  </g>
</svg>
