<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6FB"/>
      <stop offset="100%" stop-color="#FCE4EC"/>
    </linearGradient>
  </defs>
  <rect width="500" height="400" rx="16" fill="url(#bgG)"/>
  
  <!-- Silhouette of Blouse Front -->
  <g transform="translate(140, 60)">
    <!-- Blouse Main Outline -->
    <path d="M 30 40 L 70 20 Q 110 80 150 20 L 190 40 L 210 110 L 180 115 L 175 75 L 170 180 L 50 180 L 45 75 L 40 115 L 10 110 Z" fill="#F8BBD0" stroke="#D81B60" stroke-width="2.5"/>
    <!-- Princess Seams -->
    <path d="M 85 85 Q 85 140 80 180 M 135 85 Q 135 140 140 180" fill="none" stroke="#D81B60" stroke-width="1.5" stroke-dasharray="3,3"/>
    
    <!-- Measure 1: Shoulder (Across top) -->
    <line x1="70" y1="12" x2="150" y2="12" stroke="#5B2A86" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <circle cx="70" cy="12" r="3" fill="#5B2A86"/>
    <circle cx="150" cy="12" r="3" fill="#5B2A86"/>
    <text x="110" y="8" text-anchor="middle" fill="#5B2A86" font-family="'Poppins', sans-serif" font-weight="700" font-size="11">① Shoulder Width</text>

    <!-- Measure 2: Front Neck Depth -->
    <line x1="110" y1="20" x2="110" y2="70" stroke="#00897B" stroke-width="2" stroke-dasharray="3,2"/>
    <circle cx="110" cy="70" r="3" fill="#00897B"/>
    <text x="115" y="55" fill="#00897B" font-family="'Poppins', sans-serif" font-weight="700" font-size="11">② Neck Depth</text>

    <!-- Measure 3: Bust / Chest (Fullest part) -->
    <line x1="30" y1="105" x2="190" y2="105" stroke="#D81B60" stroke-width="2.5"/>
    <circle cx="30" cy="105" r="3.5" fill="#D81B60"/>
    <circle cx="190" cy="105" r="3.5" fill="#D81B60"/>
    <text x="110" y="100" text-anchor="middle" fill="#D81B60" font-family="'Poppins', sans-serif" font-weight="700" font-size="11">③ Bust / Chest</text>

    <!-- Measure 4: Waist / Underbust -->
    <line x1="45" y1="185" x2="175" y2="185" stroke="#FF6F61" stroke-width="2.5"/>
    <circle cx="45" cy="185" r="3.5" fill="#FF6F61"/>
    <circle cx="175" cy="185" r="3.5" fill="#FF6F61"/>
    <text x="110" y="200" text-anchor="middle" fill="#FF6F61" font-family="'Poppins', sans-serif" font-weight="700" font-size="11">④ Waist</text>

    <!-- Measure 5: Sleeve Length & Armhole -->
    <line x1="190" y1="40" x2="210" y2="110" stroke="#FFB300" stroke-width="2.5"/>
    <text x="215" y="75" fill="#FF8F00" font-family="'Poppins', sans-serif" font-weight="700" font-size="11">⑤ Sleeve</text>

    <!-- Measure 6: Full Length (vertical side) -->
    <line x1="230" y1="20" x2="230" y2="180" stroke="#5B2A86" stroke-width="2"/>
    <circle cx="230" cy="20" r="3" fill="#5B2A86"/>
    <circle cx="230" cy="180" r="3" fill="#5B2A86"/>
    <text x="238" y="105" fill="#5B2A86" font-family="'Poppins', sans-serif" font-weight="700" font-size="11">⑥ Length</text>
  </g>

  <!-- Legend at bottom -->
  <g transform="translate(40, 310)">
    <rect x="0" y="0" width="420" height="70" rx="10" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
    <text x="15" y="24" fill="#333333" font-family="'Poppins', sans-serif" font-size="11" font-weight="600">Standard Blouse Measurement Points:</text>
    <text x="15" y="44" fill="#666666" font-family="'Poppins', sans-serif" font-size="10">① Shoulder • ② Front Neck • ③ Bust / Chest • ④ Waist (underbust)</text>
    <text x="15" y="60" fill="#666666" font-family="'Poppins', sans-serif" font-size="10">⑤ Sleeve Length &amp; Armhole • ⑥ Full Length (shoulder to hem)</text>
  </g>
</svg>