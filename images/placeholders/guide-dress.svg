<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 440" width="500" height="440">
  <defs>
    <linearGradient id="bgD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2F1"/>
      <stop offset="100%" stop-color="#B2DFDB"/>
    </linearGradient>
  </defs>
  <rect width="500" height="440" rx="16" fill="url(#bgD)"/>

  <!-- Silhouette of Dress / Kurti -->
  <g transform="translate(130, 45)">
    <!-- Dress outline -->
    <path d="M 45 40 L 75 25 Q 120 70 165 25 L 195 40 L 225 110 L 195 115 L 180 80 L 175 140 L 165 190 L 180 230 L 235 320 Q 120 335 5 320 L 60 230 L 75 190 L 65 140 L 60 80 L 45 115 L 15 110 Z" fill="#E0F7FA" stroke="#00897B" stroke-width="2.5"/>

    <!-- Measure 1: Shoulder -->
    <line x1="75" y1="15" x2="165" y2="15" stroke="#5B2A86" stroke-width="2"/>
    <circle cx="75" cy="15" r="3" fill="#5B2A86"/>
    <circle cx="165" cy="15" r="3" fill="#5B2A86"/>
    <text x="120" y="10" text-anchor="middle" fill="#5B2A86" font-family="'Poppins', sans-serif" font-weight="700" font-size="11">① Shoulder</text>

    <!-- Measure 2: Bust -->
    <line x1="50" y1="130" x2="190" y2="130" stroke="#D81B60" stroke-width="2.5"/>
    <circle cx="50" cy="130" r="3.5" fill="#D81B60"/>
    <circle cx="190" cy="130" r="3.5" fill="#D81B60"/>
    <text x="120" y="125" text-anchor="middle" fill="#D81B60" font-family="'Poppins', sans-serif" font-weight="700" font-size="11">② Bust</text>

    <!-- Measure 3: Waist -->
    <line x1="65" y1="190" x2="175" y2="190" stroke="#FF6F61" stroke-width="2.5"/>
    <circle cx="65" cy="190" r="3.5" fill="#FF6F61"/>
    <circle cx="175" cy="190" r="3.5" fill="#FF6F61"/>
    <text x="120" y="185" text-anchor="middle" fill="#FF6F61" font-family="'Poppins', sans-serif" font-weight="700" font-size="11">③ Waist</text>

    <!-- Measure 4: Hip / Seat -->
    <line x1="60" y1="230" x2="180" y2="230" stroke="#00897B" stroke-width="2.5"/>
    <circle cx="60" cy="230" r="3.5" fill="#00897B"/>
    <circle cx="180" cy="230" r="3.5" fill="#00897B"/>
    <text x="120" y="225" text-anchor="middle" fill="#00897B" font-family="'Poppins', sans-serif" font-weight="700" font-size="11">④ Hip / Seat</text>

    <!-- Measure 5: Full Length -->
    <line x1="250" y1="25" x2="250" y2="320" stroke="#5B2A86" stroke-width="2"/>
    <circle cx="250" cy="25" r="3" fill="#5B2A86"/>
    <circle cx="250" cy="320" r="3" fill="#5B2A86"/>
    <text x="258" y="170" fill="#5B2A86" font-family="'Poppins', sans-serif" font-weight="700" font-size="11">⑤ Full Length</text>
  </g>

  <!-- Legend Bottom -->
  <g transform="translate(40, 375)">
    <rect x="0" y="0" width="420" height="50" rx="10" fill="#FFFFFF" stroke="#B2DFDB" stroke-width="1"/>
    <text x="15" y="20" fill="#00695C" font-family="'Poppins', sans-serif" font-size="11" font-weight="600">Dress / Kurti / Gown Measurement Points:</text>
    <text x="15" y="38" fill="#555555" font-family="'Poppins', sans-serif" font-size="10">① Shoulder • ② Bust • ③ Natural Waist • ④ Hip / Seat • ⑤ Full Length</text>
  </g>
</svg>