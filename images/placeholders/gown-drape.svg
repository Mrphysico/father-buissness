<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="g_gown_drape" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B5E20"/>
      <stop offset="50%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#00897B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <pattern id="pat_gown_drape" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1.5" fill="#FFFFFF" fill-opacity="0.15"/>
      <path d="M 0 15 L 30 15 M 15 0 L 15 30" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="600" height="450" fill="url(#g_gown_drape)"/>
  <rect width="600" height="450" fill="url(#pat_gown_drape)"/>

  <!-- Subtle glow circles -->
  <circle cx="500" cy="100" r="140" fill="#FFB300" fill-opacity="0.12"/>
  <circle cx="100" cy="380" r="120" fill="#FFFFFF" fill-opacity="0.08"/>

  <!-- Border stitching frame -->
  <rect x="20" y="20" width="560" height="410" rx="16" fill="none" stroke="url(#gold)" stroke-width="2" stroke-opacity="0.6"/>
  <rect x="28" y="28" width="544" height="394" rx="12" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Centered Illustrated Garment Silhouette Motif -->
  <g transform="translate(300, 190)">
    <!-- Decorative aura -->
    <circle cx="0" cy="0" r="105" fill="#FFFFFF" fill-opacity="0.08" stroke="url(#gold)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="95" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="5,3"/>

    <!-- Evening Gown Silhouette -->
    <path d="M -20 -60 Q 0 -50 20 -60 L 30 -30 L 18 -15 L 20 5 L 85 85 Q 0 95 -85 85 L -20 5 L -18 -15 L -30 -30 Z" fill="#FFFFFF" fill-opacity="0.92" stroke="url(#gold)" stroke-width="2"/>
    <!-- Corset / Belt -->
    <rect x="-18" y="0" width="36" height="8" rx="2" fill="url(#gold)"/>
    <!-- Gown drape curves -->
    <path d="M -18 8 Q 10 40 45 84 M -10 8 Q -40 50 -60 84" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.8"/>
    <path d="M -80 80 Q 0 90 80 80" fill="none" stroke="url(#gold)" stroke-width="4"/>

  </g>

  <!-- Title & Tag Badge Bottom -->
  <g transform="translate(300, 360)">
    <rect x="-170" y="-18" width="340" height="52" rx="26" fill="#15101E" fill-opacity="0.75" stroke="url(#gold)" stroke-width="1.5"/>
    <text x="0" y="7" text-anchor="middle" fill="#FFFFFF" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="20">
      Emerald Indo-Western Drape Gown
    </text>
    <text x="0" y="24" text-anchor="middle" fill="#FFE082" font-family="'Poppins', sans-serif" font-size="12" font-weight="500">
      ઇન્ડો-વેસ્ટર્ન ગાઉન • Pearl Belt Cincher
    </text>
  </g>
</svg>